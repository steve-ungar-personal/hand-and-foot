# Deploys to Vercel from GitHub Actions. The Vercel project is NOT connected to Git;
# this workflow is the only thing that deploys it.
# Required repository secret: VERCEL_TOKEN, created while signed in to the LoserLeague
# Vercel account (https://vercel.com/account/tokens), with access to the loser-league team.
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  # Not secret: identify the Vercel team and project.
  VERCEL_ORG_ID: team_83QzLfE9jVzrVmsygkXjbB72
  VERCEL_PROJECT_ID: prj_CTEM8rDIjOyamrOEsSBzBPMyeCHF

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings and env vars
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
